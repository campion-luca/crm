<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestionale Lavoro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: sidebar menu + aziende a sinistra · Home a moduli (calendario, scadenze, aziende). Tema unico scuro: fondo nero, caselle grafite con dettagli rosa */
  --bg:#0a0a0b; --side:#050505; --surface:#151517; --surface-2:#1e1e21; --line:#2a2a2e; --ink:#f3f3f5; --ink-2:#b4b4bc; --ink-3:#77777f;
  --accent:#ff6eb4; --accent-ink:#3a0b22; --accent-soft:rgba(255,110,180,.14);
  --danger:#ff5d73; --warn:#ffb547; --ok:#3ddc97; --sun:#ffb547;
  --font-body:"Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r:12px; --shadow:0 1px 2px rgba(0,0,0,.25), 0 8px 22px rgba(0,0,0,.22);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.ic{width:15px;height:15px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.app{display:grid;grid-template-columns:264px 1fr;height:100%}

/* sidebar */
.side{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.brand{padding:18px 18px 12px;display:flex;align-items:center;gap:10px}
.brand-mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#ff6eb4,#ff9a7a);color:#3a0b22;display:grid;place-items:center;font-weight:700;font-size:13px;letter-spacing:-.02em}
.brand h1{font-size:15px;margin:0;font-weight:600;letter-spacing:-.01em}
.brand small{display:block;color:var(--ink-3);font-size:11.5px}
.side-scroll{flex:1;overflow:auto;padding:4px 10px 12px}
.side-sec{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);padding:14px 8px 6px;display:flex;justify-content:space-between;align-items:center}
.side-sec button{border:0;background:none;color:var(--ink-3);padding:2px 6px;border-radius:5px;font-size:12px;text-transform:none;letter-spacing:0}
.side-sec button:hover{background:var(--surface-2);color:var(--ink)}
.nav-item{display:flex;align-items:center;gap:9px;width:100%;border:0;background:none;text-align:left;padding:7px 8px;border-radius:6px;color:var(--ink-2)}
.nav-item:hover{background:var(--surface);color:var(--ink)}
.nav-item.on{background:var(--accent-soft);color:var(--accent);font-weight:700;box-shadow:inset 3px 0 0 var(--accent)}
.nav-item .count{margin-left:auto;font-family:var(--font-mono);font-size:11.5px;color:var(--ink-3)}
.nav-item .count.hot{color:var(--danger)}
.dot{width:10px;height:10px;border-radius:3px;flex:none}
.co{border-radius:6px}
.co.drop-hover,.nav-item.drop-hover{outline:2px dashed var(--accent);outline-offset:-2px}
.co-row{display:flex;align-items:center}
.co-row .nav-item{flex:1;min-width:0}
.co-row .nav-item span.name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.caret{border:0;background:none;width:22px;height:28px;color:var(--ink-3);display:grid;place-items:center;border-radius:5px;flex:none}
.caret:hover{background:var(--surface-2)}
.caret svg{transition:transform .15s}
.caret.open svg{transform:rotate(90deg)}
.co-edit{opacity:0;border:0;background:none;color:var(--ink-3);width:24px;height:28px;border-radius:5px;flex:none}
.co-row:hover .co-edit{opacity:1}
.co-edit:hover{background:var(--surface-2);color:var(--ink)}
.folders{padding-left:22px}
.folders .nav-item{padding:5px 8px;font-size:13px}
.folders .add-folder{color:var(--ink-3);font-size:12.5px}
.side-foot{border-top:1px solid var(--line);padding:10px 14px;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-3)}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--ink-3)}
.sync-dot.ok{background:var(--ok)} .sync-dot.err{background:var(--danger)} .sync-dot.busy{background:var(--warn)}
.side-foot button{margin-left:auto;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:4px 9px;font-size:12px;color:var(--ink-2)}
.side-foot button:hover{color:var(--ink);border-color:var(--ink-3)}

/* main */
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{display:flex;align-items:center;gap:14px;padding:14px 26px;border-bottom:1px solid var(--line);background:var(--surface)}
.crumb{display:flex;align-items:center;gap:8px;min-width:0}
.crumb h2{font-size:18px;margin:0;font-weight:600;letter-spacing:-.015em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-wrap:balance}
.crumb .sub{color:var(--ink-3);font-size:13px;white-space:nowrap}
.tabs{display:flex;background:var(--surface-2);border-radius:8px;padding:3px;gap:2px;margin-left:auto}
.tab{border:0;background:none;padding:6px 12px;border-radius:6px;color:var(--ink-2);display:flex;gap:6px;align-items:center;font-weight:500}
.tab.on{background:var(--surface);color:var(--accent);box-shadow:var(--shadow);font-weight:700}
.tab kbd{font-family:var(--font-mono);font-size:10px;color:var(--ink-3)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 12px;display:inline-flex;align-items:center;gap:6px;font-weight:500;color:var(--ink)}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--danger)}
.btn.danger.armed{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.ghost{border-color:transparent;background:none;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink)}

.toolbar{display:flex;align-items:center;gap:10px;padding:10px 22px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.search{display:flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:0 10px;height:32px;width:210px;color:var(--ink-3)}
.search input{border:0;background:none;outline:none;width:100%;color:var(--ink)}
.search:focus-within{border-color:var(--accent)}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 9px 4px 7px;font-size:12px;display:inline-flex;align-items:center;gap:5px;color:var(--ink-2)}
.chip:hover{color:var(--ink);border-color:var(--ink-3)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.sel{height:32px;border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:0 8px}
.tb-sep{width:1px;height:20px;background:var(--line)}
.tb-right{margin-left:auto;display:flex;gap:8px;align-items:center}
.toggle{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-2);cursor:pointer;user-select:none}

.banner{margin:12px 22px 0;padding:10px 14px;border-radius:12px;background:var(--accent-soft);border:1px solid rgba(255,110,180,.3);display:flex;gap:12px;align-items:center;font-size:13px}
.banner .btn{padding:5px 10px;font-size:12.5px}
.banner .grow{flex:1}

.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;padding:14px 22px 4px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;text-align:left;display:flex;align-items:center;gap:12px}
.stat:hover{border-color:var(--ink-3)}
.stat.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.stat .n{font-family:var(--font-mono);font-size:22px;font-weight:500;line-height:1}
.stat .l{font-size:12.5px;color:var(--ink-2)}
.stat .bar{width:4px;align-self:stretch;border-radius:3px}

.view{flex:1;min-height:0;overflow:auto;padding:14px 22px 22px}

/* board */
.board{display:grid;grid-template-columns:repeat(4,minmax(240px,1fr));gap:14px;min-height:100%;align-items:start}
.col{background:var(--surface);border-radius:16px;padding:8px;display:flex;flex-direction:column;gap:8px;min-height:200px}
.col.drop-hover{outline:2px dashed var(--accent);outline-offset:-2px}
.col-h{display:flex;align-items:center;gap:8px;padding:4px 6px 2px;font-weight:600;font-size:13px}
.col-h .n{font-family:var(--font-mono);font-size:11.5px;color:var(--ink-3);font-weight:400}
.col-h button{margin-left:auto;border:0;background:none;color:var(--ink-3);border-radius:5px;width:24px;height:24px;display:grid;place-items:center}
.col-h button:hover{background:var(--surface);color:var(--ink)}
.status-dot{width:8px;height:8px;border-radius:50%}
.card{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px 11px 9px;cursor:pointer;display:flex;flex-direction:column;gap:7px;position:relative;box-shadow:0 1px 1px rgba(0,0,0,.03)}
.card:hover{border-color:var(--accent)}
.card.dragging{opacity:.4}
.card .stripe{position:absolute;left:-1px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0}
.card-t{font-weight:500;line-height:1.35;word-break:break-word}
.card.done .card-t{text-decoration:line-through;color:var(--ink-3)}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--ink-2)}
.co-tag{display:inline-flex;align-items:center;gap:5px;max-width:100%}
.co-tag .dot{width:8px;height:8px;border-radius:2px}
.co-tag span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.type-tag{display:inline-flex;align-items:center;gap:4px;color:var(--ink-2)}
.type-tag .ic{width:13px;height:13px}
.prio{font-size:11px;font-weight:600;padding:2px 7px;border-radius:999px;letter-spacing:.01em;white-space:nowrap}
.due{font-family:var(--font-mono);font-size:11.5px;display:inline-flex;align-items:center;gap:4px;color:var(--ink-2)}
.due.over{color:var(--danger);font-weight:500}
.due.today{color:var(--warn);font-weight:500}
.prog{display:inline-flex;align-items:center;gap:4px;font-family:var(--font-mono);font-size:11.5px;color:var(--ink-3)}
.card-foot{display:flex;justify-content:space-between;align-items:center;gap:6px}
.empty-col{color:var(--ink-3);font-size:12.5px;text-align:center;padding:16px 6px;border:1px dashed var(--line);border-radius:8px}

/* list */
.lgroup{margin-bottom:20px}
.lgroup-h{display:flex;align-items:center;gap:8px;font-weight:600;padding:4px 2px 8px;font-size:13px}
.lgroup-h .n{font-family:var(--font-mono);font-size:11.5px;color:var(--ink-3);font-weight:400}
table.list{width:100%;border-collapse:separate;border-spacing:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
table.list th{font-size:11px;color:var(--accent) !important;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);font-weight:500;text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--surface)}
table.list td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
table.list tr:last-child td{border-bottom:0}
table.list tbody tr{cursor:pointer}
table.list tbody tr:hover td{background:var(--surface-2)}
table.list tr.done .lt{text-decoration:line-through;color:var(--ink-3)}
.lt{font-weight:500}
.chk{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--ink-3);background:none;display:grid;place-items:center;padding:0;color:transparent}
.chk.on{background:var(--ok);border-color:var(--ok);color:#06281b}
.chk svg{width:12px;height:12px}
.status-pill{font-size:12px;display:inline-flex;align-items:center;gap:6px;color:var(--ink-2);white-space:nowrap}

/* calendar */
.cal-wrap{display:grid;grid-template-columns:1fr 290px;gap:16px;height:100%;min-height:560px}
.cal{background:var(--surface);border:1px solid var(--line);border-radius:16px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.cal-h{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line)}
.cal-h h3{margin:0 8px 0 0;font-size:16px;font-weight:600;text-transform:capitalize;min-width:150px}
.cal-legend{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);padding:8px 14px;border-bottom:1px solid var(--line)}
.cal-legend span{display:inline-flex;gap:5px;align-items:center}
.cal-dow{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--line)}
.cal-dow div{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);padding:7px 8px}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-auto-rows:minmax(104px,1fr);flex:1}
.day{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:5px 5px 6px;display:flex;flex-direction:column;gap:3px;min-width:0;cursor:pointer;position:relative}
.day:nth-child(7n){border-right:0}
.day.out{background:rgba(0,0,0,.35)}
.day.out .dn{color:var(--ink-3)}
.day.wknd{background:rgba(255,255,255,.025)}
.day.picked{box-shadow:inset 0 0 0 2px var(--accent)}
.day.drop-hover{background:var(--accent-soft)}
.dn{font-family:var(--font-mono);font-size:12px;color:var(--ink-2);display:flex;justify-content:space-between;align-items:center;padding:0 2px}
.day.today .dn b{background:var(--accent);color:var(--accent-ink);border-radius:7px;padding:1px 6px;font-weight:500}
.dn b{font-weight:400}
.dn .add{opacity:0;border:0;background:none;color:var(--ink-3);width:18px;height:18px;border-radius:4px;display:grid;place-items:center;padding:0}
.day:hover .dn .add{opacity:1}
.dn .add:hover{background:var(--surface-2);color:var(--ink)}
.ev{font-size:11.5px;border-radius:6px;padding:2px 6px 2px 5px;border-left:4px solid;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;display:flex;gap:4px;align-items:center;color:var(--ink)}
.ev .ic{width:11px;height:11px}
.ev.done{opacity:.5;text-decoration:line-through}
.ev .tm{font-family:var(--font-mono);font-size:10.5px;color:var(--ink-2)}
.more{font-size:11px;color:var(--ink-3);padding-left:4px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.panel-sec{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:7px;min-height:0}
.panel-sec:last-child{border-bottom:0;flex:1;overflow:auto}
.panel-sec h4{margin:0;font-size:13px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.panel-sec h4 small{font-weight:400;color:var(--ink-3);text-transform:none;font-size:12px}
.panel-sec .hint{font-size:12px;color:var(--ink-3)}
.mini{border:1px solid var(--line);border-left:3px solid;border-radius:6px;padding:7px 9px;display:flex;flex-direction:column;gap:4px;cursor:pointer;background:var(--surface)}
.mini:hover{border-color:var(--accent)}
.mini .t{font-size:13px;font-weight:500}
.mini.done .t{text-decoration:line-through;color:var(--ink-3)}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:flex-start;justify-content:center;padding:6vh 16px;z-index:50;overflow:auto}
.overlay.open{display:flex}
.modal{background:var(--surface);border-top:3px solid var(--accent) !important;border-radius:18px;width:100%;max-width:640px;box-shadow:0 20px 60px rgba(0,0,0,.3);border:1px solid var(--line)}
.modal.sm{max-width:420px}
.modal-h{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 6px}
.modal-h h3{margin:0;font-size:16px;font-weight:600}
.modal-b{padding:10px 20px 6px;display:flex;flex-direction:column;gap:14px}
.modal-f{display:flex;gap:8px;padding:14px 20px 18px;align-items:center}
.modal-f .grow{flex:1}
.f{display:flex;flex-direction:column;gap:5px}
.f label{font-size:12px;color:var(--ink-2);font-weight:500}
.f input,.f select,.f textarea{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:8px 10px;outline:none;width:100%}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--accent)}
.f textarea{resize:vertical;min-height:70px}
.title-in{font-size:17px !important;font-weight:600;border:0 !important;padding:4px 0 !important;border-bottom:1px solid var(--line) !important;border-radius:0 !important}
.row{display:grid;gap:12px}
.row.c2{grid-template-columns:1fr 1fr} .row.c3{grid-template-columns:1fr 1fr 1fr} .row.c4{grid-template-columns:repeat(4,1fr)}
.seg{display:flex;flex-wrap:wrap;gap:5px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:6px 9px;font-size:12.5px;display:inline-flex;gap:5px;align-items:center;color:var(--ink-2)}
.seg button:hover{color:var(--ink);border-color:var(--ink-3)}
.seg button.on{border-color:var(--accent);color:var(--ink);box-shadow:0 0 0 1px var(--accent) inset;background:var(--accent-soft);font-weight:600}
.cl{display:flex;flex-direction:column;gap:4px}
.cl-item{display:flex;align-items:center;gap:8px}
.cl-item input[type=text]{flex:1;border:0;border-bottom:1px solid transparent;border-radius:0;padding:4px 2px;background:none}
.cl-item input[type=text]:focus{border-bottom-color:var(--accent)}
.cl-item.done input[type=text]{text-decoration:line-through;color:var(--ink-3)}
.cl-item .x{border:0;background:none;color:var(--ink-3);width:22px;height:22px;border-radius:4px}
.cl-item .x:hover{background:var(--surface-2);color:var(--danger)}
.swatches{display:flex;gap:7px;flex-wrap:wrap}
.sw{width:26px;height:26px;border-radius:7px;border:2px solid transparent;padding:0}
.sw.on{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--surface)}
.x-btn{border:0;background:none;color:var(--ink-3);width:30px;height:30px;border-radius:7px;display:grid;place-items:center}
.x-btn:hover{background:var(--surface-2);color:var(--ink)}
.small{font-size:12px;color:var(--ink-3)}
textarea.json{font-family:var(--font-mono);font-size:11.5px;min-height:140px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--surface);padding:9px 14px;border-radius:8px;font-size:13px;opacity:0;transition:.2s;pointer-events:none;z-index:60;display:flex;gap:10px;align-items:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
.toast button{border:0;background:none;color:var(--accent);font-weight:600;padding:0}
.kbd-help{font-size:11.5px;color:var(--ink-3)}
.kbd-help kbd{font-family:var(--font-mono);border:1px solid var(--line);border-radius:4px;padding:0 4px;font-size:10.5px}

/* home */
.home{display:flex;flex-direction:column;gap:20px;max-width:1500px}
.hello{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.hello h2{color:var(--ink);font-size:28px;margin:0;font-weight:800;letter-spacing:-.025em;text-wrap:balance}
.hello p{margin:4px 0 0;color:var(--ink-2);font-size:14px}
.pills{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap;align-items:center}
.pill{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;font-weight:700;font-size:13px;border:0}
.pill b{font-family:var(--font-mono);font-weight:500;font-size:14px}
.pill:hover{filter:brightness(.97)}
.modules{display:grid;grid-template-columns:minmax(0,1.8fr) minmax(330px,1fr);gap:20px;align-items:start}
.module{background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:0 1px 2px rgba(0,0,0,.2),0 10px 30px rgba(0,0,0,.22);overflow:hidden;display:flex;flex-direction:column;min-width:0}
.module-h{display:flex;align-items:center;gap:10px;padding:16px 18px 14px;border-bottom:1px solid var(--line);position:relative}
.module-h::after{content:"";position:absolute;left:18px;bottom:-1px;width:38px;height:2px;border-radius:2px;background:var(--accent)}

const GG=['dom','lun','mar','mer','gio','ven','sab'];
function fmtDue(t){
  if(!t.due) return '';
  const d=diffDays(t.due,todayISO());
  let s;
  if(d===0) s='Oggi'; else if(d===1) s='Domani'; else if(d===-1) s='Ieri';
  else if(d>1&&d<7) s=GG[parseISO(t.due).getDay()];
  else {const x=parseISO(t.due); s=x.getDate()+' '+MESI[x.getMonth()].slice(0,3);}
  return s+(t.time?' '+t.time:'');
}

/* ---------- sincronizzazione ---------- */
let remoteRef=null, syncStatus='local', remoteTimer=null;
function setSync(s){syncStatus=s;const el=$('#syncLabel'),d=$('#syncDot');if(!el)return;
  const map={local:['Salvato in questo browser',''],busy:['Sincronizzo…','busy'],ok:['Sincronizzato sul tuo account','ok'],err:['Sync non riuscita, salvato in locale','err']};
  el.textContent=map[s][0];d.className='sync-dot '+map[s][1];}
function scheduleRemote(){if(!remoteRef)return;clearTimeout(remoteTimer);setSync('busy');remoteTimer=setTimeout(pushRemote,900);}
async function pushRemote(){if(!remoteRef)return;try{await remoteRef.set({json:JSON.stringify(state),updatedAt:state.updatedAt||Date.now()});setSync('ok');}catch(e){setSync('err');}}
function unwrap(s){if(s==null)return null;if(typeof s.data==='function'){if(s.exists===false)return null;return s.data();}if(s.data&&typeof s.data==='object'&&!('json' in s))return s.data;return s;}
async function initRemote(){
  if(!window.claude||typeof window.claude.use!=='function'){setSync('local');return;}
  try{
    const db=await window.claude.use('db'); if(!db){setSync('local');return;}
    const user=await window.claude.use('user'); if(!user){setSync('local');return;}
    const id=await user.id(); if(!id){setSync('local');return;}
    const ref=db.collection('data/users/'+id).doc('gestionale');
    setSync('busy');
    const got=await Promise.race([ref.get(),new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),10000))]);
    remoteRef=ref;
    const d=unwrap(got);
    if(d&&d.json){
      const raw=JSON.parse(d.json), before=JSON.stringify(raw), rs=migrate(raw), changed=JSON.stringify(rs)!==before;
      if(state.sample||(rs.updatedAt||0)>=(state.updatedAt||0)){state=rs;lsSet(LS_KEY,JSON.stringify(state));renderAll();if(changed){state.updatedAt=Date.now();await pushRemote();}else setSync('ok');}
      else if((state.updatedAt||0)>(rs.updatedAt||0)){await pushRemote();}
      else setSync('ok');
    } else if(!state.sample){await pushRemote();}
    else setSync('ok');
  }catch(e){setSync(remoteRef?'err':'local');}
}

function filtered(opts){
  opts=opts||{};
  const q=ui.q.trim().toLowerCase(), t0=todayISO(), wk=addDays(t0,7);
  return scopeTasks().filter(t=>{
    if(q){const c=company(t.companyId),f=folder(t.folderId);
      const hay=(t.title+' '+t.notes+' '+(c?c.name:'')+' '+(f?f.name:'')).toLowerCase(); if(!hay.includes(q))return false;}
    
    if(ui.prio&&P(t.priority).id!==ui.prio)return false;
    if(!ui.showDone&&t.status==='done'&&!opts.keepDone)return false;
    if(!opts.ignoreDue&&ui.due){
      if(ui.due==='over'&&!isOver(t))return false;
      if(ui.due==='today'&&!(t.due===t0&&t.status!=='done'))return false;
      if(ui.due==='week'&&!(t.due&&t.due>=t0&&t.due<=wk&&t.status!=='done'))return false;
      if(ui.due==='doing'&&t.status!=='doing')return false;
    }
    return true;
  });
}

function prioPill(p){const x=P(p);return '<span class="prio" title="Priorità '+x.id+' · '+x.name+'" style="background:color-mix(in srgb,'+x.color+' 16%,transparent);color:'+x.color+'">'+x.label+'</span>';}
function coTag(t,showFolder){const c=company(t.companyId),f=folder(t.folderId);if(!c)return '';
  return '<span class="co-tag"><span class="dot" style="background:'+c.color+'"></span><span>'+esc(ui.company&&!showFolder?'':c.name)+(f?(ui.company&&!showFolder?'':' · ')+esc(f.name):'')+'</span></span>';}
function dueTag(t){if(!t.due)return '';return '<span class="due'+(isOver(t)?' over':isToday(t)&&t.status!=='done'?' today':'')+'">'+ICON.clock+fmtDue(t)+'</span>';}
const linkedOf=t=>(t.linked||[]).map(id=>task(id)).filter(Boolean);
const parentsOf=t=>state.tasks.filter(x=>(x.linked||[]).includes(t.id));
function ancestorsOf(id,seen){seen=seen||new Set();state.tasks.forEach(x=>{if((x.linked||[]).includes(id)&&!seen.has(x.id)){seen.add(x.id);ancestorsOf(x.id,seen);}});return seen;}
function linkTag(t){const l=linkedOf(t);if(!l.length)return '';const d=l.filter(x=>x.status==='done').length;
  return '<span class="prog link'+(d===l.length?' all':'')+'" title="Task collegate completate">'+ICON.link+d+'/'+l.length+'</span>';}
function forTag(t){const p=parentsOf(t).filter(x=>x.status!=='done');if(!p.length)return '';return '<span class="for-tag" title="Serve per completare">'+ICON.link+'per: '+esc(p[0].title)+(p.length>1?' +'+(p.length-1):'')+'</span>';}
function afterDone(t){ // avvisa se il genitore è ora pronto
  const ready=parentsOf(t).find(p=>p.status!=='done'&&linkedOf(p).every(x=>x.status==='done'));
  if(ready) toast('Tutte le collegate di «'+ready.title+'» sono fatte',false,'<button data-act="toggleDone" data-id="'+ready.id+'">Completa anche questa</button>');
}
function progTag(t){if(!t.checklist||!t.checklist.length)return '';const d=t.checklist.filter(x=>x.done).length;return '<span class="prog">'+ICON.cl+d+'/'+t.checklist.length+'</span>';}
function fmtEst(m){if(!m)return '';return m<60?m+' min':(m/60).toFixed(m%60?1:0).replace('.',',')+' h';}

function cardHTML(t){
  return '<div class="card'+(t.status==='done'?' done':'')+'" draggable="true" data-drag="'+t.id+'" data-act="openTask" data-id="'+t.id+'"><span class="stripe" style="background:'+P(t.priority).color+'"></span>'+
    '<div class="meta">'+coTag(t)+'</div>'+
    '<div class="card-t">'+esc(t.title)+'</div>'+(forTag(t)?'<div class="meta">'+forTag(t)+'</div>':'')+
    (t.estimate?'<div class="meta"><span class="small mono">'+fmtEst(t.estimate)+'</span></div>':'')+
    '<div class="card-foot">'+prioPill(t.priority)+'<span class="meta">'+linkTag(t)+progTag(t)+dueTag(t)+'</span></div></div>';
}

function companyStats(c){
  const all=state.tasks.filter(t=>t.companyId===c.id), open=all.filter(t=>t.status!=='done'), t0=todayISO(), w=addDays(t0,7);
  const next=open.filter(t=>t.due&&t.due>=t0).sort((a,b)=>(a.due+(a.time||'99')).localeCompare(b.due+(b.time||'99')))[0];
  return {all,open,done:all.length-open.length,over:open.filter(isOver).length,today:open.filter(t=>t.due===t0).length,week:open.filter(t=>t.due&&t.due>=t0&&t.due<=w).length,
    est:open.reduce((a,t)=>a+(+t.estimate||0),0),next,folders:state.folders.filter(f=>f.companyId===c.id)};
}

function fmtDone(ms){if(!ms)return '—';const d=new Date(ms), ds=iso(d), diff=diffDays(ds,todayISO());
  const day=diff===0?'Oggi':diff===-1?'Ieri':d.getDate()+' '+MESI[d.getMonth()].slice(0,3)+(d.getFullYear()!==new Date().getFullYear()?' '+d.getFullYear():'');
  return day+', '+pad(d.getHours())+':'+pad(d.getMinutes());}
function completedHTML(list,inCompany){
  const done=list.filter(t=>t.status==='done').sort((a,b)=>(b.completedAt||0)-(a.completedAt||0));
  const max=ui.showAllDone?done.length:10, rows=done.slice(0,max);
  let h='<section class="module done-mod"><div class="module-h"><span class="module-ic" style="background:rgba(61,220,151,.15);color:var(--ok)">'+ICON.check+'</span><h3>Completi</h3><span class="n">'+done.length+'</span></div>';
  if(!done.length) return h+'<div class="dl-empty"><b>Ancora niente qui</b>Quando spunti una task la trovi in questa tabella, con data e ora.</div></section>';
  h+='<div class="tbl-wrap"><table class="list done-tbl"><thead><tr><th style="width:40px"></th><th>Task</th>'+(inCompany?'<th>Cartella</th>':'<th>Azienda / cartella</th>')+'<th>Priorità</th><th>Scadenza</th><th>Completata il</th><th>Esito</th></tr></thead><tbody>'+
    rows.map(t=>{const f=folder(t.folderId);let esito='<span class="small">—</span>';
      if(t.due&&t.completedAt){const late=diffDays(iso(new Date(t.completedAt)),t.due);esito=late>0?'<span class="badge late">'+late+' gg di ritardo</span>':'<span class="badge ok">In tempo</span>';}
      return '<tr data-act="openTask" data-id="'+t.id+'"><td><button class="chk on" data-act="toggleDone" data-id="'+t.id+'" title="Riapri la task" aria-label="Riapri">'+ICON.check+'</button></td>'+
      '<td><span class="lt">'+esc(t.title)+'</span></td><td><span class="meta">'+(inCompany?(f?esc(f.name):'<span class="small">—</span>'):coTag(t,true))+'</span></td><td>'+prioPill(t.priority)+'</td>'+
      '<td class="mono small">'+(t.due?parseISO(t.due).getDate()+' '+MESI[parseISO(t.due).getMonth()].slice(0,3):'—')+'</td><td class="mono small done-at">'+fmtDone(t.completedAt)+'</td><td>'+esito+'</td></tr>';}).join('')+
    '</tbody></table></div>';
  if(done.length>10) h+='<div class="module-f"><span>'+(ui.showAllDone?'Tutte le '+done.length+' completate':'Ultime 10 di '+done.length)+'</span><button class="linkbtn" data-act="toggleAllDone">'+(ui.showAllDone?'Mostra meno':'Mostra tutte')+'</button></div>';

  h+='<div class="panel"><div class="panel-sec"><h4>'+GG[sd.getDay()].replace(/^./,c=>c.toUpperCase())+' '+sd.getDate()+' '+MESI[sd.getMonth()]+' <small>'+dayItems.length+' lavori'+(est?' · '+fmtEst(est):'')+'</small></h4>'+
    (dayItems.length?dayItems.map(mini).join(''):'<span class="hint">Giornata libera.</span>')+
    '<button class="btn" data-act="newTask" data-due="'+sel+'" style="align-self:flex-start">'+ICON.plus+' Aggiungi a questo giorno</button></div>'+
    '<div class="panel-sec"><h4>Da pianificare <small>'+unplanned.length+'</small></h4><span class="hint">Lavori senza scadenza. Trascinali su un giorno del calendario.</span>'+
    (unplanned.length?unplanned.map(mini).join(''):'<span class="hint">Tutto ha una data.</span>')+'</div></div></div>';
  return h;
}

function lnkHTML(){

function lnkOptions(){

function saveTaskSilently(){ // salva il draft corrente senza chiudere (per aprire una collegata)
  if(!draft||!draft.title||!draft.due) return;
  draft.checklist=(draft.checklist||[]).filter(c=>c.text.trim());

function readTaskForm(){
  draft.title=$('#tTitle').value.trim(); draft.companyId=$('#tCompany').value;
  const fv=$('#tFolder').value; draft.folderId=fv==='__new'?'':fv;
  draft.due=$('#tDue').value||null; draft.time=$('#tTime').value||''; draft.estimate=+$('#tEst').value||0;

function saveTask(){
  readTaskForm();
  if(!draft.title){$('#tTitle').focus();toast('Dai un titolo al lavoro');return;}
  if(!draft.due){$('#tDue').focus();toast('Ogni task ha bisogno di una scadenza');return;}
  draft.checklist=draft.checklist.filter(c=>c.text.trim());
  {const prev=draft.id?task(draft.id):null; if(draft.status==='done'&&(!prev||prev.status!=='done'))draft.completedAt=Date.now(); if(draft.status!=='done')delete draft.completedAt;}
  if(draft.id){const i=state.tasks.findIndex(t=>t.id===draft.id);state.tasks[i]=draft;}
  else{draft.id=uid();draft.created=Date.now();state.tasks.push(draft);}
  closeModal(); commit('Salvato');
}

let toastT=null;
function toast(msg,withUndo,extra){const t=$('#toast');t.innerHTML=esc(msg)+(withUndo?' <button data-act="undo">Annulla</button>':'')+(extra?' '+extra:'');t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>{t.classList.remove('show');pendingUndo=null;},(withUndo||extra)?7000:2200);}

const armed=new WeakSet();
function confirmBtn(btn){if(armed.has(btn))return true;armed.add(btn);btn.classList.add('armed');btn.dataset.orig=btn.textContent;btn.textContent='Conferma';setTimeout(()=>{if(btn.isConnected){armed.delete(btn);btn.classList.remove('armed');btn.textContent=btn.dataset.orig;}},3000);return false;}

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el)return;
  const a=el.dataset.act, id=el.dataset.id;
  if(e.target===$('#overlay'))return;
  switch(a){
    case 'selCompany': ui.company=id||null; ui.folder=null; if(id){ui.expanded[id]=true; ui.view='company';} else if(ui.view==='company') ui.view='home'; renderAll(); break;
    case 'selFolder': {e.stopPropagation(); const f=folder(id); ui.company=f.companyId; ui.folder=id; ui.view='company'; renderAll(); break;}
    case 'toggleAllDone': ui.showAllDone=!ui.showAllDone; renderView(); break;
    case 'dashTab': ui.dashTab=id; renderView(); saveUI(); break;
    case 'editProfile': openProfile(id); break;
    case 'pfAdd': {readProfileForm(); const l=el.dataset.list; draft.p[l].push(l==='brandColors'?'#ff6eb4':l==='links'?{label:'',url:''}:{name:'',role:'',email:'',phone:''}); renderProfileModal(); break;}
    case 'pfDel': readProfileForm(); draft.p[el.dataset.list].splice(+id,1); renderProfileModal(); break;
    case 'copy': {const v=el.dataset.v; e.preventDefault(); e.stopPropagation(); (navigator.clipboard?navigator.clipboard.writeText(v):Promise.reject()).then(()=>toast('Copiato: '+v)).catch(()=>toast(v)); break;}
    case 'dashFolder': ui.folder=id||null; renderAll(); break;
    case 'toggleCo': {const cur=ui.expanded[id]!==false&&(ui.expanded[id]||ui.company===id); ui.expanded[id]=!cur; renderSide(); saveUI(); break;}
    case 'newCompany': openCompany(); break;
    case 'editCompany': e.stopPropagation(); openCompany(id); break;
    case 'newFolder': e.stopPropagation(); openFolder(null,id); break;
    case 'editFolder': openFolder(id); break;
    case 'view': if(ui.view==='company'&&id!=='company'&&(id==='home'||id==='companies')){ui.company=null;ui.folder=null;} ui.view=id; renderAll(); break;
    case 'newTask': e.stopPropagation(); if(draft&&draft.kind==='day') closeModal(); openTask(null,Object.assign({},el.dataset.status?{status:el.dataset.status}:{},el.dataset.due?{due:el.dataset.due}:{})); break;
    case 'openTask': if(e.target.closest('.chk'))return; e.stopPropagation(); if(draft&&draft.kind==='day') closeModal(); openTask(id); break;
    case 'toggleDone': {e.stopPropagation(); const t=task(id); if(!t)return;
      if(t.status!=='done'){const open=linkedOf(t).filter(x=>x.status!=='done'); if(open.length){askCompleteLinked(t,open);break;}}
      snapshot(); setStatus(t,t.status==='done'?'todo':'done'); commit(t.status==='done'?'Spostata in Completi':'Riaperta',true); if(t.status==='done') afterDone(t); break;}
    case 'doneAll': {const t=task(id); snapshot(); linkedOf(t).forEach(x=>setStatus(x,'done')); setStatus(t,'done'); closeModal(); commit('Completata con tutte le collegate',true); break;}
    case 'doneOnly': {const t=task(id); snapshot(); setStatus(t,'done'); closeModal(); commit('Spostata in Completi',true); afterDone(t); break;}
    case 'lnkToggle': {const c=task(id); setStatus(c,c.status==='done'?'todo':'done'); state.updatedAt=Date.now(); lsSet(LS_KEY,JSON.stringify(state)); scheduleRemote(); renderAll(); $('#lnk').innerHTML=lnkHTML(); break;}
    case 'lnkDel': draft.linked=(draft.linked||[]).filter(x=>x!==id); $('#lnk').innerHTML=lnkHTML(); break;
    case 'lnkOpen': {readTaskForm(); saveTaskSilently(); openTask(id); break;}
    case 'due': ui.due=ui.due===id?'':id; renderAll(); break;
    case 'clearFilters': ui.types=[];ui.prio='';ui.q='';ui.due=''; renderAll(); break;
    case 'calPrev': case 'calNext': {const [y,m]=ui.calMonth.split('-').map(Number);const d=new Date(y,m-1+(a==='calNext'?1:-1),1);ui.calMonth=d.getFullYear()+'-'+pad(d.getMonth()+1);renderView();saveUI();break;}
    case 'calToday': ui.calMonth=curMonth(); ui.calDay=todayISO(); renderView(); saveUI(); break;
    case 'openDay': openDay(id); break;
    case 'pickCompany': if(e.target.closest('.chip,.co-edit'))return; ui.company=id; ui.folder=null; ui.expanded[id]=true; ui.view='company'; ui.dashTab='overview'; renderAll(); window.scrollTo(0,0); $('#view').scrollTop=0; break;
    case 'horizon': ui.horizon=+id; renderAll(); break;
    case 'setColor': {const c=company(id); c.color=el.dataset.color; commit(); break;}
    case 'loadSample': state=sampleState(); ui.company=null; ui.folder=null; lsSet(LS_KEY,JSON.stringify(state)); renderAll(); toast('Esempi caricati'); break;
    case 'wipeNow': if(!confirmBtn(el))return; snapshot(); state=emptyState(); ui.company=null;ui.folder=null; commit('Dati svuotati',true); break;
    case 'goList': ui.view='list'; ui.due=id; renderAll(); break;
    case 'selDay': ui.calDay=id; if(id.slice(0,7)!==ui.calMonth) ui.calMonth=id.slice(0,7); renderView(); saveUI(); break;
    case 'close': closeModal(); break;
    case 'delTask': if(!confirmBtn(el))return; snapshot(); state.tasks=state.tasks.filter(t=>t.id!==draft.id); state.tasks.forEach(t=>{if(t.linked)t.linked=t.linked.filter(x=>x!==draft.id);}); closeModal(); commit('Lavoro eliminato',true); break;
    case 'dupTask': {readTaskForm(); const c=JSON.parse(JSON.stringify(draft)); c.id=uid(); c.title=c.title+' (copia)'; c.created=Date.now(); c.status='todo'; delete c.completedAt; c.linked=[]; c.checklist.forEach(x=>{x.id=uid();x.done=false;}); state.tasks.push(c); closeModal(); commit('Duplicato'); openTask(c.id); break;}
    case 'clToggle': {readTaskForm(); const c=draft.checklist.find(x=>x.id===id); c.done=!c.done; $('#cl').innerHTML=clHTML(); break;}
    case 'clDel': readTaskForm(); draft.checklist=draft.checklist.filter(x=>x.id!==id); $('#cl').innerHTML=clHTML(); break;
    case 'swatch': draft.color=id; document.querySelectorAll('.sw').forEach(s=>s.classList.toggle('on',s.dataset.id===id)); break;
    case 'delCompany': if(!confirmBtn(el))return; snapshot(); state.tasks=state.tasks.filter(t=>t.companyId!==draft.id); state.folders=state.folders.filter(f=>f.companyId!==draft.id); state.companies=state.companies.filter(c=>c.id!==draft.id); if(ui.company===draft.id){ui.company=null;ui.folder=null;} closeModal(); commit('Azienda eliminata',true); break;
    case 'delFolder': if(!confirmBtn(el))return; snapshot(); state.tasks.forEach(t=>{if(t.folderId===draft.id)t.folderId='';}); state.folders=state.folders.filter(f=>f.id!==draft.id); if(ui.folder===draft.id)ui.folder=null; closeModal(); commit('Cartella eliminata',true); break;
    case 'backup': openBackup(); break;
    case 'copyBk': {const ta=$('#bkOut'); const v=ta.value; (navigator.clipboard?navigator.clipboard.writeText(v):Promise.reject()).then(()=>toast('Copiato negli appunti')).catch(()=>{ta.select();toast('Seleziona e copia con Ctrl+C');}); break;}
    case 'dlBk': {try{const b=new Blob([$('#bkOut').value],{type:'application/json'});const u=URL.createObjectURL(b);const l=document.createElement('a');l.href=u;l.download='gestionale-backup-'+todayISO()+'.json';document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);toast('Download avviato (se non parte, usa Copia)');}catch(err){toast('Download non disponibile qui: usa Copia');} break;}
    case 'importBk': {const v=$('#bkIn').value.trim(); if(!v){toast('Incolla un backup o scegli un file');return;} try{const s=JSON.parse(v); if(!Array.isArray(s.tasks)||!Array.isArray(s.companies))throw 0; snapshot(); state=Object.assign({folders:[]},s); ui.company=null;ui.folder=null; closeModal(); commit('Backup ripristinato',true);}catch(err){toast('Il testo non è un backup valido');} break;}
    case 'wipe': if(!confirmBtn(el))return; snapshot(); state=emptyState(); ui.company=null;ui.folder=null; closeModal(); commit('Dati svuotati',true); break;
    case 'startEmpty': state=emptyState(); ui.company=null;ui.folder=null;ui.types=[];ui.prio='';ui.due=''; commit(); break;
    case 'keepSample': commit('Ora gli esempi sono tuoi: rinominali o eliminali quando vuoi'); break;
    case 'undo': undo(); break;
  }
});

document.addEventListener('click',e=>{
  const b=e.target.closest('.seg button'); if(!b||!draft)return;
  const seg=b.closest('.seg'); draft[seg.dataset.seg]=b.dataset.v;
  seg.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));
});

document.addEventListener('submit',e=>{
  e.preventDefault();
  if(e.target.id==='taskForm') saveTask();
  else if(e.target.id==='coForm'){
    const name=$('#coName').value.trim(); if(!name)return;
    if(draft.id){const c=company(draft.id);c.name=name;c.color=draft.color;closeModal();commit('Azienda aggiornata');}
    else{const c={id:uid(),name,color:draft.color};state.companies.push(c);ui.company=c.id;ui.folder=null;ui.expanded[c.id]=true;closeModal();commit('Azienda creata');}
  } else if(e.target.id==='pfForm'){
    readProfileForm(); const p=draft.p;
    p.contacts=p.contacts.filter(k=>k.name||k.email||k.phone); p.links=p.links.filter(l=>l.url); p.brandColors=p.brandColors.filter(Boolean);
    company(draft.id).profile=p; closeModal(); commit('Scheda salvata');
  } else if(e.target.id==='foForm'){
    const name=$('#foName').value.trim(), co=$('#foCo').value; if(!name)return;
    if(draft.id){const f=folder(draft.id); if(f.companyId!==co){state.tasks.forEach(t=>{if(t.folderId===f.id)t.companyId=co;});} f.name=name; f.companyId=co; closeModal(); commit('Cartella aggiornata');}
    else{const f={id:uid(),companyId:co,name};state.folders.push(f);ui.company=co;ui.folder=f.id;ui.expanded[co]=true;closeModal();commit('Cartella creata');}
  }
});

document.addEventListener('input',e=>{
  if(e.target.dataset&&e.target.dataset.k==='pick'){e.target.parentElement.querySelector('[data-k=hex]').value=e.target.value;}
  if(e.target.dataset&&e.target.dataset.k==='hex'&&/^#[0-9a-f]{6}$/i.test(e.target.value)){e.target.parentElement.querySelector('[data-k=pick]').value=e.target.value;}
  if(e.target.id==='q'){ui.q=e.target.value;renderSummary();renderView();
    const has=ui.prio||ui.q||ui.due, btn=document.querySelector('[data-act="clearFilters"]'); if(!!has!==!!btn) renderToolbar();}
});
document.addEventListener('change',e=>{
  const id=e.target.id;
  if(id==='prioSel'){ui.prio=e.target.value;renderAll();}
  else if(id==='groupSel'){ui.listGroup=e.target.value;renderView();saveUI();}
  else if(id==='showDone'){ui.showDone=e.target.checked;renderAll();}
  else if(id==='colorBy'){ui.colorBy=e.target.value;renderView();saveUI();}
  else if(id==='setColorBy'){ui.colorBy=e.target.value;saveUI();toast('Salvato');}
  else if(id==='setHorizon'){ui.horizon=+e.target.value;renderAll();toast('Salvato');}
  else if(id==='setShowDone'){ui.showDone=e.target.value==='1';renderAll();toast('Salvato');}
  else if(id==='tCompany'&&draft){readTaskForm();draft.folderId='';const cur=draft;renderTaskModal();draft=cur;}
  else if(id==='lnkAdd'&&draft){const v=e.target.value;if(!v)return;draft.linked=(draft.linked||[]).concat(v);$('#lnk').innerHTML=lnkHTML();e.target.innerHTML='<option value="">+ Collega una task esistente…</option>'+lnkOptions();}
  else if(id==='tFolder'&&e.target.value==='__new'){
    const wrap=e.target.parentElement; const inp=document.createElement('input'); inp.placeholder='Nome nuova cartella e Invio'; inp.id='tFolderNew'; wrap.appendChild(inp); inp.focus();
  }
  else if(id==='bkFile'){const f=e.target.files[0]; if(!f)return; const r=new FileReader(); r.onload=()=>{$('#bkIn').value=r.result;toast('File caricato: premi Ripristina');}; r.readAsText(f);}
});
document.addEventListener('keydown',e=>{
  const tag=(e.target.tagName||'').toLowerCase(), typing=tag==='input'||tag==='textarea'||tag==='select';
  const modalOpen=$('#overlay').classList.contains('open');
  if(e.key==='Escape'){if(modalOpen){closeModal();}else if(e.target.id==='q'){ui.q='';e.target.blur();renderAll();}return;}
  if(modalOpen){
    if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)&&$('#taskForm')){e.preventDefault();saveTask();return;}
    if(e.key==='Enter'&&e.target.id==='lnkNew'){e.preventDefault();const v=e.target.value.trim();if(!v)return;readTaskForm();
      const c={id:uid(),title:v,companyId:draft.companyId,folderId:draft.folderId||'',priority:P(draft.priority).id,status:'todo',due:draft.due||todayISO(),time:'',estimate:0,notes:'',link:'',checklist:[],linked:[],created:Date.now()};
      state.tasks.push(c); draft.linked=(draft.linked||[]).concat(c.id); state.updatedAt=Date.now(); lsSet(LS_KEY,JSON.stringify(state)); scheduleRemote(); renderAll();
      $('#lnk').innerHTML=lnkHTML(); e.target.value=''; $('#lnkAdd').innerHTML='<option value="">+ Collega una task esistente…</option>'+lnkOptions(); return;}
    if(e.key==='Enter'&&e.target.id==='clNew'){e.preventDefault();const v=e.target.value.trim();if(!v)return;readTaskForm();draft.checklist.push({id:uid(),text:v,done:false});$('#cl').innerHTML=clHTML();e.target.value='';return;}
    if(e.key==='Enter'&&e.target.id==='tFolderNew'){e.preventDefault();const v=e.target.value.trim();if(!v)return;readTaskForm();const f={id:uid(),companyId:draft.companyId,name:v};state.folders.push(f);draft.folderId=f.id;const cur=draft;renderTaskModal();draft=cur;commit();return;}
    if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.clText){e.preventDefault();$('#clNew').focus();return;}
    return;
  }
  if(typing||e.ctrlKey||e.metaKey||e.altKey)return;
  const k=e.key.toLowerCase();
  if(k==='n'){e.preventDefault();openTask(null);}
  else if(k==='/'){e.preventDefault();$('#q').focus();}
  else if(k==='h'){ui.view='home';renderAll();}
  else if(k==='s'){ui.view='scad';renderAll();}
  else if(k==='a'){ui.view='companies';renderAll();}
  else if(k==='b'){ui.view='board';renderAll();}
  else if(k==='l'){ui.view='list';renderAll();}
  else if(k==='c'){ui.view='cal';renderAll();}
});

/* ---------- drag & drop ---------- */
let dragId=null;
document.addEventListener('dragstart',e=>{const el=e.target.closest&&e.target.closest('[data-drag]');if(!el)return;dragId=el.dataset.drag;el.classList.add('dragging');try{e.dataTransfer.setData('text/plain',dragId);e.dataTransfer.effectAllowed='move';}catch(_){}});
document.addEventListener('dragend',e=>{document.querySelectorAll('.dragging,.drop-hover').forEach(x=>x.classList.remove('dragging','drop-hover'));dragId=null;});
function dropTarget(e){let el=e.target.closest&&e.target.closest('[data-drop]');while(el&&el.dataset.drop==='none')el=null;return el;}
document.addEventListener('dragover',e=>{if(!dragId)return;const el=dropTarget(e);if(!el)return;e.preventDefault();document.querySelectorAll('.drop-hover').forEach(x=>{if(x!==el)x.classList.remove('drop-hover');});el.classList.add('drop-hover');});
document.addEventListener('drop',e=>{
  if(!dragId)return; const el=dropTarget(e); if(!el)return; e.preventDefault();
  const t=task(dragId); if(!t)return; const kind=el.dataset.drop, v=el.dataset.id; let msg='';
  snapshot();
  if(kind==='status'){if(t.status===v)return;setStatus(t,v);msg='Spostato in '+S(v).label;}
  else if(kind==='day'){if(t.due===v)return;t.due=v;const d=parseISO(v);msg='Scadenza: '+d.getDate()+' '+MESI[d.getMonth()];ui.calDay=v;}
  else if(kind==='company'){if(t.companyId===v&&!t.folderId)return;t.companyId=v;t.folderId='';msg='Spostato in '+company(v).name;}
  else if(kind==='folder'){const f=folder(v);if(t.folderId===v)return;t.folderId=v;t.companyId=f.companyId;msg='Spostato in '+f.name;}
  commit(msg,true);
});

/* ---------- avvio ---------- */
renderAll();
initRemote();
})();
</script>
</body>
</html>
